spring:
  datasource:
    url: jdbc:mysql://localhost:3306/movie_theatre?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

booking:
  cleanup:
    rate: 60000  # 1 phút
    hold-duration: 300  # 5 phút

logging:
  level:
    com.CS3332Group5.MovieTheatreManagementSystem: DEBUG
    org.springframework.web.socket: DEBUG

vnpay:
  tmnCode: ${VNPAY_TMN_CODE:DEMO}  # Thay bằng mã merchant thật khi deploy
  hashSecret: ${VNPAY_HASH_SECRET:DEMO}  # Thay bằng khóa bí mật thật khi deploy
  payUrl: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  returnUrl: ${VNPAY_RETURN_URL:http://localhost:8080/api/bookings/vnpay-return} 