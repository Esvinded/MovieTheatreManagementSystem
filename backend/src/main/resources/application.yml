spring:
  datasource:
    url: jdbc:mysql://localhost:3306/movie_theatre?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  security:
    user:
      name: demoUser
      password: demoPass

booking:
  cleanup:
    rate: 60000      # scheduler chạy mỗi 60s
    hold-duration: 300  # timeout = 5′

logging:
  level:
    com.CS3332Group5.MovieTheatreManagementSystem: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.security: DEBUG

vnpay:
  tmnCode: ${VNPAY_TMN_CODE:DEMO}
  hashSecret: ${VNPAY_HASH_SECRET:DEMO}
  payUrl: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  returnUrl: ${VNPAY_RETURN_URL:http://localhost:8080/api/bookings/vnpay-return}
